[pytest]
# ROOTDIR IS THIS DIRECTORY ON PURPOSE, AND THE SUITE IS RUN FROM HERE, for
# the reason household_state's suite documents: the repo root carries the
# integration's own __init__.py (hacs.json content_in_root, because
# jrackerby/HA submodules this AS custom_components/waste_collection). Any
# collection tree including the repo root makes a pytest Package node of it,
# whose setup() imports that __init__.py as a TOP-LEVEL module, and its
# `from .const import ...` then fails with "attempted relative import with no
# known parent package" at setup of every test. conftest.py stages the
# package properly instead.
# Run it as: cd tests && pytest    (tools/run_tests.sh does this)
addopts = --import-mode=importlib
