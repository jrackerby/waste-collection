name: validate

# Same posture as household-state's: a repo that only validates on push goes
# quietly stale between commits, and these repos sit untouched for months.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:

env:
  DOMAIN: waste_collection

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Into a subdirectory ON PURPOSE -- the staging step below builds the
      # layout hassfest expects AT THE WORKSPACE ROOT and cannot do that if the
      # repo is already checked out there.
      - uses: actions/checkout@v4
        with:
          path: src

      # home-assistant/actions/hassfest takes no path input: it scans
      # custom_components/* under the workspace. This repo keeps the
      # integration at its ROOT (hacs.json content_in_root) because
      # jrackerby/HA submodules it AS custom_components/waste_collection.
      - name: stage the custom_components layout hassfest scans
        run: |
          mkdir -p "custom_components/$DOMAIN"
          cp -a src/. "custom_components/$DOMAIN/"
          rm -rf "custom_components/$DOMAIN/.git" "custom_components/$DOMAIN/.github"
          test -f "custom_components/$DOMAIN/manifest.json" \
            || { echo "CANNOT RUN: staging produced no manifest.json -- hassfest would pass vacuously"; exit 1; }
          echo "staged $(find "custom_components/$DOMAIN" -type f | wc -l) files"

      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # NO homeassistant install here, and this suite needs no stubs either:
      # resolver.py and const.py import nothing outside the stdlib, which is
      # the point of keeping the calendar arithmetic in a module that cannot
      # reach `homeassistant.*`. Seconds long, and a red result is
      # attributable to this repo rather than to a core release moving.
      - run: pip install pytest
      - name: pytest
        run: ./tools/run_tests.sh -q

      # A gate that could not run is not a pass: `pytest -q` exits 0 on
      # "no tests ran", so a staging or import break that collects nothing
      # would report green over a suite that never executed.
      - name: assert the suite is not empty
        run: |
          COUNT=$(cd tests && python -m pytest --collect-only -q 2>/dev/null | grep -c '::' || true)
          test "$COUNT" -gt 0 \
            || { echo "CANNOT RUN: zero tests collected -- the step above passed vacuously"; exit 1; }
          echo "collected $COUNT tests"

  imports:
    # THE GATE THIS REPO NEEDS THAT household-state DOES NOT, and the reason is
    # specific rather than stylistic. Its coordinator reads core through a
    # narrow, guarded surface that stubs model faithfully. This integration
    # uses the CONFIG SUBENTRY API -- ConfigSubentryFlow,
    # async_get_supported_subentry_types, async_add_entities(config_subentry_id=...)
    # -- which is young, and which the session that wrote this could not
    # import-check: it ran Python 3.11, and Home Assistant 2026.9 needs 3.13,
    # so `pip install homeassistant` offered nothing newer than 2024.3 there.
    # Rather than assert those names were right, the check moved here, where a
    # runner can install the real thing. hassfest does not catch this: it
    # validates the manifest and translations, never an import.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.14, NOT 3.13. Home Assistant 2026.x declares
          # Requires-Python >=3.14.2, so on 3.13 pip silently FILTERS OUT every
          # 2026 release and then reports "no matching distribution" for a
          # version that plainly exists -- which reads as a bad pin rather than
          # a wrong interpreter. Measured on this job's first run.
          python-version: "3.14"

      # Pinned to the floor hacs.json declares, not to latest: this asserts the
      # integration imports on the OLDEST core it claims to support. A newer
      # core that also works is not what the claim says.
      - name: install the core version hacs.json claims support for
        run: |
          set -euo pipefail
          # Assert the interpreter BEFORE pip, so a runner image without a new
          # enough 3.14 fails saying that, rather than as a confusing
          # "no matching distribution" for a version that exists.
          python - <<'PY'
          import sys
          need = (3, 14, 2)
          if sys.version_info[:3] < need:
              raise SystemExit(
                  f"CANNOT RUN: Home Assistant 2026.x needs Python >= {'.'.join(map(str, need))}, "
                  f"this runner has {sys.version.split()[0]} -- pip would filter every 2026 "
                  "release and report a misleading 'no matching distribution'"
              )
          print(f"python {sys.version.split()[0]} satisfies core's Requires-Python")
          PY
          FLOOR="$(python -c 'import json;print(json.load(open("hacs.json"))["homeassistant"])')"
          echo "hacs.json floor: $FLOOR"
          pip install "homeassistant==$FLOOR"

      - name: import every module against real core
        run: |
          set -euo pipefail
          mkdir -p "stage/custom_components/$DOMAIN"
          cp -a ./*.py "stage/custom_components/$DOMAIN/"
          cp -a manifest.json translations "stage/custom_components/$DOMAIN/"
          touch stage/custom_components/__init__.py
          cd stage
          MODULES=$(cd "custom_components/$DOMAIN" && ls *.py | sed 's/\.py$//' | grep -v '^__init__$')
          echo "modules: $MODULES"
          test -n "$MODULES" \
            || { echo "CANNOT RUN: no modules staged -- this would pass vacuously"; exit 1; }
          python - <<PY
          import importlib, sys
          sys.path.insert(0, ".")
          mods = """$MODULES""".split()
          failed = []
          for m in ["__init__", *mods]:
              name = f"custom_components.$DOMAIN.{m}" if m != "__init__" else "custom_components.$DOMAIN"
              try:
                  importlib.import_module(name)
                  print(f"  ok   {name}")
              except Exception as exc:
                  failed.append((name, exc))
                  print(f"  FAIL {name}: {type(exc).__name__}: {exc}")
          if failed:
              sys.exit(f"{len(failed)} module(s) failed to import against real core")
          print(f"imported {len(mods) + 1} modules cleanly")
          PY

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # VOID -- NOT A PASS, AND NOT A FAILURE OF THIS REPO. HACS fetches
      # hacs.json and manifest.json from raw.githubusercontent.com with NO
      # Authorization header, in CI and in a live install alike, so a private
      # repository 404s. Reporting it VOID keeps the distinction that matters:
      # the check did not run, so nothing was proven either way. jrackerby/HA#483.
      - name: VOID -- HACS validation cannot run against a private repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::notice title=HACS validation VOID::this repository is private, so HACS cannot read it"
          echo "See jrackerby/HA#483. This is a VOID, not a pass."
